# The same checks the daily deploy runs, on every pull request, so a broken page is caught before merge.
# No secrets: the GitHub-API checks (gen-now --check, the commit strip) stay in the deploy.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: python3 tools/gen-writing.py --check
      - run: python3 tools/lint-copy.py
      - run: python3 tools/check-pages.py
      - run: python3 tools/check-facts.py
      - run: python3 -m unittest tools/test_gen_now.py tools/test_draft_now.py tools/test_check_live.py tools/test_gen_lastmod.py tools/test_check_facts.py
      # Game engine, route rules and the balance simulation, on the Node the ubuntu-24.04 image ships
      # (22.x). The shell expands the file list: Node 21+ no longer accepts a directory for --test.
      - run: node --version && node --test games/*/test/*.test.mjs
